name: Pull Request CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bundled JSON and CMake presets
        run: |
          python3 -m json.tool CMakePresets.json > /dev/null
          python3 -m json.tool src/resources/patches.json > /dev/null
      - name: Test companion services and offline tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Exercise synthetic Final EX GDS and SVG tools
        run: |
          python3 tools/gds_inspector.py examples/fnex/synthetic_mode.gds --json > /dev/null
          python3 tools/gds_visualizer.py examples/fnex/synthetic_mode.gds --output "$RUNNER_TEMP/fnex_lane_map.svg"
          python3 -c 'import sys,xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$RUNNER_TEMP/fnex_lane_map.svg"

      - name: Exercise Final EX passive mode inventory and event rehearsal
        run: |
          python3 tools/fnex_mode_inventory.py examples/fnex --json > /dev/null
          python3 tools/fnex_trace_replay.py --input examples/fnex/synthetic_observations.jsonl --output "$RUNNER_TEMP/fnex_events.jsonl" --json > /dev/null
          python3 tools/event_bridge.py --file "$RUNNER_TEMP/fnex_events.jsonl" > /dev/null
          python3 -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; assert len(rows)==4 and all(r["data"]["synthetic"] and r["data"]["verified"] is False for r in rows)' "$RUNNER_TEMP/fnex_events.jsonl"
  windows-build:
    runs-on: windows-latest
    needs: validate-json
    steps:
      - uses: actions/checkout@v4
      - name: Test modern Windows compatibility and scoring companion
        shell: pwsh
        run: |
          python -m unittest discover -s tools/tests -p 'test_compatibility_doctor.py' -v
          python -m unittest discover -s tools/tests -p 'test_companion_server.py' -v
      - name: Test redacted Windows application crash diagnostics
        shell: pwsh
        run: |
          $report = & ./tools/windows_crash_report.ps1 -XmlPath ./tools/tests/fixtures/synthetic_application_error.xml | ConvertFrom-Json
          if ($report.unique_crashes -ne 1) { throw 'Expected one Event 1000 crash' }
          if ($report.crashes[0].module -ne 'examplegpu32.dll') { throw 'Unexpected fault module' }
          if ($report.crashes[0].exception_code -ne 'c0000005') { throw 'Unexpected exception' }
          if ($report.groups[0].count -ne 1) { throw 'Unexpected crash group count' }
          if (($report | ConvertTo-Json -Depth 8) -match 'TEST-PRIVATE-DO-NOT-OUTPUT') { throw 'User paths were leaked' }
      - name: Test cross-vendor GPU inventory redaction and zero side effects
        shell: pwsh
        run: |
          $report = & ./tools/gpu_compatibility_report.ps1 -FixturePath ./tools/tests/fixtures/synthetic_gpu_adapters.json | ConvertFrom-Json
          if ($report.adapter_count -ne 2) { throw 'Expected two synthetic GPU adapters' }
          if (-not $report.multiple_adapters_detected) { throw 'Expected multiple-adapter detection' }
          if ($report.modifies_gpu_preference) { throw 'Tool must never change GPU preference' }
          if ($report.validates_game_compatibility) { throw 'Inventory does not validate game runtime' }
          $names = @($report.adapters | ForEach-Object { $_.name })
          if ($names -notcontains 'Vendor A Integrated Sample' -or $names -notcontains 'Vendor B Discrete Sample') { throw 'Vendor-neutral inventory failed' }
          if (($report | ConvertTo-Json -Depth 8) -match 'PRIVATE-DO-NOT-OUTPUT|PRIVATE-DEVICE-ID') { throw 'Private GPU identifiers leaked' }
      - name: Configure Release (includes verified GCC download)
        run: cmake --preset release
      - name: Build Release
        run: cmake --build --preset release --parallel 2
      - name: Smoke test presentation helper validation
        shell: pwsh
        run: |
          $app = Resolve-Path 'build/release/bin/2EZWindowMode.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--invalid' -Wait -PassThru
          if ($process.ExitCode -ne 2) { throw "Expected safe exit code 2, got $($process.ExitCode)" }
          Write-Host 'Window mode helper rejects invalid invocation without touching game processes.'
      - name: Smoke-test native DX7 probe without GPU calls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = & ./build/release/bin/2EZDx7Probe.exe --self-test | ConvertFrom-Json
          if (-not $report.read_only -or $report.injects_game -or $report.modifies_display_mode) { throw 'Unsafe probe flags' }
          if (-not $report.self_test -or $report.game_compatibility_verified) { throw 'Unexpected test claim' }
          if ($report.render_device_test_requested -or $report.render_surface_created -or $report.d3d7_render_device_created) { throw 'Self-test must not allocate any render surface' }
          if (-not $report.no_persistent_changes -or $report.render_device_kind -ne 'none') { throw 'Incorrect safe probe self-test state' }
          $probe = (Resolve-Path './build/release/bin/2EZDx7Probe.exe').Path
          $proc = Start-Process -FilePath $probe -ArgumentList '--invalid' -Wait -PassThru -RedirectStandardError "$env:RUNNER_TEMP\dx7-invalid-stderr.txt"
          if ($proc.ExitCode -ne 2) { throw "Invalid probe invocation should return status 2, got $($proc.ExitCode)" }
      - name: Run settings persistence tests
        run: ctest --test-dir build/release --output-on-failure
      - name: Verify expected outputs
        shell: pwsh
        run: |
          foreach ($path in @("build/release/bin/2EZConfig.exe", "build/release/bin/2EZ.dll", "build/release/bin/2EZWindowMode.exe", "build/release/bin/2EZDx7Probe.exe")) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing output: $path" }
            $file = Get-Item $path
            if ($file.Length -eq 0) { throw "Empty output: $path" }
            Write-Host "$path SHA256=$((Get-FileHash $path -Algorithm SHA256).Hash)"
          }
      - name: Publish unsigned CI artifacts (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: 2EZConfig-ci-win32
          if-no-files-found: error
          path: |
            build/release/bin/2EZ.dll
            build/release/bin/2EZConfig.exe
            build/release/bin/2EZWindowMode.exe
            build/release/bin/2EZDx7Probe.exe
